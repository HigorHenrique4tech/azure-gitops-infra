name: PR title

# Workflow separado do pr.yml de propósito: aqui o gatilho inclui "edited", para corrigir o título
# de um PR já aberto reexecutar a checagem, sem reexecutar o lint e o plan inteiros.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Com squash merge, o título do PR vira a mensagem do commit na main.
      # Por isso ele precisa seguir Conventional Commits.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
