version: 2

updates:
  # Mantém as actions dos workflows atualizadas. Como elas estão fixadas por SHA,
  # o Dependabot abre um PR trocando o SHA e o comentário da versão.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Mantém os providers do Terraform atualizados (arquivos .terraform.lock.hcl das stacks).
  - package-ecosystem: terraform
    directories:
      - "/stacks/*"
      - "/modules/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
