# Instalar uma vez por clone:  pre-commit install
# Rodar em tudo:               pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
# Sem isto, todos os hooks também rodariam no estágio commit-msg (sem arquivos para checar).
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      # Mantém a tabela de variáveis e outputs dos READMEs dos módulos sempre em dia.
      - id: terraform_docs
        files: ^modules/
        args:
          # Caminho relativo à raiz do repositório, de onde o hook roda
          - --args=--config=.terraform-docs.yml

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.29
    hooks:
      - id: checkov
        args: [--quiet]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--config-file, .yamllint.yaml]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
