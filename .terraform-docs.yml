# Gera a tabela de variáveis, outputs e providers dos módulos.
# O texto entre <!-- BEGIN_TF_DOCS --> e <!-- END_TF_DOCS --> do README é gerado; o resto é escrito à mão.
formatter: "markdown table"

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: false
  html: false
  lockfile: false
